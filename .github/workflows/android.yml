# Builds an installable Android APK from dist/web (Capacitor). Download it from the run's "Artifacts".
name: Build Android APK
on:
  push:
    branches: [main]
    paths: ["dist/web/**", "native/**", ".github/workflows/android.yml"]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: native } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties   # SDK is preinstalled on GitHub runners
      - run: npm ci
      - run: rm -rf www && cp -r ../dist/web www && npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AssetRecord-android-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
